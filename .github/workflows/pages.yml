name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Check patch whitespace
        run: git diff --check
      - name: Validate and build the Pages artifact
        run: npm test
      - name: Restore recent successful page assets
        uses: actions/cache/restore@v4
        with:
          path: .pages-asset-history
          key: pages-assets-v2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pages-assets-v2-${{ runner.os }}-
      - name: Keep recent assets for already-open tabs
        run: node pages/retain-recent-assets.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Remember assets after successful deployment
        uses: actions/cache/save@v4
        with:
          path: .pages-asset-history
          key: pages-assets-v2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
