<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-labelledby="title desc"><title id="title">Two invented towns, different routes</title><desc id="desc">Hill Town homes are across a river from the bus stop. River Town homes and bus stop are on the same side. Both towns have a footbridge. Not to scale.</desc><rect width="880" height="420" rx="20" fill="#f4f0e5"/><path d="M440 25V395" stroke="#bdccc1" stroke-width="2"/><g font-family="sans-serif" fill="#203f3d"><text x="28" y="40" font-size="28" font-weight="bold">Hill Town</text><text x="468" y="40" font-size="28" font-weight="bold">River Town</text><path d="M245 65 Q205 185 245 290T245 405 M685 65Q645 185 685 290T685 405" stroke="#9bd4e4" stroke-width="55" fill="none"/><path d="M90 155V250H350V180 M530 155V250H790 M530 250V330H565" fill="none" stroke="#866c48" stroke-width="7" stroke-dasharray="9 6"/><path d="M195 239H263V261H195Z M635 239H703V261H635Z" fill="#edbe67" stroke="#203f3d" stroke-width="3"/><g fill="#346557"><path d="M55 110l35-30 35 30v50H55Z M495 110l35-30 35 30v50H495Z"/></g><g font-size="23"><text x="40" y="193">Homes</text><text x="480" y="193">Homes</text><text x="301" y="150">Bus stop</text><text x="480" y="385">Bus stop</text><text x="210" y="310">Footbridge</text><text x="650" y="310">Footbridge</text><text x="268" y="90">River</text><text x="708" y="90">River</text></g><g fill="#f0c46b" stroke="#203f3d" stroke-width="3"><rect x="324" y="165" width="53" height="30" rx="5"/><rect x="539" y="315" width="53" height="30" rx="5"/></g><g fill="#203f3d"><circle cx="334" cy="198" r="6"/><circle cx="367" cy="198" r="6"/><circle cx="549" cy="348" r="6"/><circle cx="582" cy="348" r="6"/></g></g></svg>
