<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Digital does not mean weightless</title>
  <desc id="desc">A Grade 6 systems map showing an AI request travelling through a network to a data centre and returning as a response. It identifies what the system is built from, what it runs with, what it leaves or changes, possible benefits and costs, and rules for checking environmental claims.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102d40"/>
      <stop offset="1" stop-color="#173f4f"/>
    </linearGradient>
    <linearGradient id="centre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f6875"/>
      <stop offset="1" stop-color="#184f5b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#071923" flood-opacity=".3"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 12 7 1 13Z" fill="#e5a544"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1640" cy="70" r="310" fill="#2b7780" opacity=".11"/>
  <circle cx="210" cy="1010" r="330" fill="#e5a544" opacity=".06"/>

  <g font-family="Inter, Aptos, Arial, sans-serif">
    <text x="960" y="76" fill="#fffaf0" font-size="62" font-weight="800" text-anchor="middle" letter-spacing="1">DIGITAL DOES NOT MEAN WEIGHTLESS</text>
    <text x="960" y="122" fill="#9fd5d6" font-size="25" font-weight="700" text-anchor="middle" letter-spacing="4">AN AI ANSWER HAS A PHYSICAL ROUTE</text>

    <!-- Main route -->
    <g filter="url(#shadow)">
      <rect x="90" y="170" width="340" height="190" rx="28" fill="#f7f1df"/>
      <rect x="550" y="170" width="340" height="190" rx="28" fill="#e7f2ef"/>
      <rect x="1010" y="154" width="380" height="222" rx="32" fill="url(#centre)" stroke="#79c4c4" stroke-width="3"/>
      <rect x="1510" y="170" width="320" height="190" rx="28" fill="#f7f1df"/>
    </g>

    <!-- Request icon -->
    <rect x="140" y="215" width="78" height="100" rx="8" fill="none" stroke="#1a5965" stroke-width="7"/>
    <circle cx="179" cy="296" r="5" fill="#1a5965"/>
    <path d="M246 226h111a18 18 0 0 1 18 18v35a18 18 0 0 1-18 18h-52l-24 20 5-20h-40a18 18 0 0 1-18-18v-35a18 18 0 0 1 18-18Z" fill="#e5a544" opacity=".9"/>
    <text x="260" y="326" fill="#153b4a" font-size="30" font-weight="850" text-anchor="middle">REQUEST</text>
    <text x="260" y="351" fill="#41616a" font-size="19" text-anchor="middle">a person or tool asks</text>

    <!-- Network icon -->
    <g stroke="#1a6771" stroke-width="7" fill="#fff">
      <line x1="640" y1="225" x2="800" y2="297"/>
      <line x1="640" y1="297" x2="800" y2="225"/>
      <circle cx="640" cy="225" r="18"/>
      <circle cx="800" cy="225" r="18"/>
      <circle cx="640" cy="297" r="18"/>
      <circle cx="800" cy="297" r="18"/>
    </g>
    <text x="720" y="326" fill="#153b4a" font-size="30" font-weight="850" text-anchor="middle">NETWORK</text>
    <text x="720" y="351" fill="#41616a" font-size="19" text-anchor="middle">moves data between places</text>

    <!-- Data centre icon -->
    <g fill="none" stroke="#d7f1ee" stroke-width="7">
      <rect x="1112" y="186" width="82" height="116" rx="8"/>
      <rect x="1208" y="186" width="82" height="116" rx="8"/>
      <line x1="1132" y1="214" x2="1175" y2="214"/>
      <line x1="1132" y1="244" x2="1175" y2="244"/>
      <line x1="1228" y1="214" x2="1271" y2="214"/>
      <line x1="1228" y1="244" x2="1271" y2="244"/>
    </g>
    <circle cx="1150" cy="278" r="6" fill="#e5a544"/>
    <circle cx="1246" cy="278" r="6" fill="#e5a544"/>
    <text x="1200" y="329" fill="#fff" font-size="31" font-weight="850" text-anchor="middle">DATA CENTRE</text>
    <text x="1200" y="356" fill="#cbe6e3" font-size="20" text-anchor="middle">chips calculate</text>

    <!-- Response icon -->
    <path d="M1580 211h171a20 20 0 0 1 20 20v63a20 20 0 0 1-20 20h-81l-30 25 7-25h-67a20 20 0 0 1-20-20v-63a20 20 0 0 1 20-20Z" fill="#e5a544"/>
    <path d="M1605 243h119M1605 271h91" stroke="#173f4f" stroke-width="7" stroke-linecap="round"/>
    <text x="1670" y="326" fill="#153b4a" font-size="30" font-weight="850" text-anchor="middle">RESPONSE</text>
    <text x="1670" y="351" fill="#41616a" font-size="19" text-anchor="middle">output returns to the user</text>

    <path d="M444 265H526" stroke="#e5a544" stroke-width="9" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M904 265H986" stroke="#e5a544" stroke-width="9" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M1404 265H1486" stroke="#e5a544" stroke-width="9" stroke-linecap="round" marker-end="url(#arrow)"/>

    <!-- Physical system cards -->
    <g filter="url(#shadow)">
      <rect x="70" y="410" width="560" height="265" rx="24" fill="#f9f5e9"/>
      <rect x="680" y="410" width="560" height="265" rx="24" fill="#e5f1ee"/>
      <rect x="1290" y="410" width="560" height="265" rx="24" fill="#f9f5e9"/>
    </g>
    <rect x="70" y="410" width="560" height="68" rx="24" fill="#d99a3d"/>
    <path d="M70 454h560v24H70Z" fill="#d99a3d"/>
    <rect x="680" y="410" width="560" height="68" rx="24" fill="#2f7881"/>
    <path d="M680 454h560v24H680Z" fill="#2f7881"/>
    <rect x="1290" y="410" width="560" height="68" rx="24" fill="#397567"/>
    <path d="M1290 454h560v24h-560Z" fill="#397567"/>

    <text x="350" y="455" fill="#142f3d" font-size="29" font-weight="900" text-anchor="middle">BUILT FROM</text>
    <text x="960" y="455" fill="#fff" font-size="29" font-weight="900" text-anchor="middle">RUNS WITH</text>
    <text x="1570" y="455" fill="#fff" font-size="29" font-weight="900" text-anchor="middle">LEAVES OR CHANGES</text>

    <g fill="#163c4b" font-size="27" font-weight="700">
      <circle cx="122" cy="522" r="9" fill="#d99a3d"/><text x="148" y="531">minerals</text>
      <circle cx="122" cy="574" r="9" fill="#d99a3d"/><text x="148" y="583">chips and hardware</text>
      <circle cx="122" cy="626" r="9" fill="#d99a3d"/><text x="148" y="635">buildings and transport</text>

      <circle cx="732" cy="522" r="9" fill="#2f7881"/><text x="758" y="531">electricity</text>
      <circle cx="732" cy="574" r="9" fill="#2f7881"/><text x="758" y="583">cooling by water or air</text>
      <circle cx="732" cy="626" r="9" fill="#2f7881"/><text x="758" y="635">workers and networks</text>

      <circle cx="1342" cy="514" r="9" fill="#397567"/><text x="1368" y="523" font-size="25">useful services and heat</text>
      <circle cx="1342" cy="566" r="9" fill="#397567"/><text x="1368" y="568" font-size="24"><tspan x="1368" dy="0">local electricity and</tspan><tspan x="1368" dy="29">cooling demand</tspan></text>
      <circle cx="1342" cy="626" r="9" fill="#397567"/><text x="1368" y="628" font-size="24"><tspan x="1368" dy="0">replacement equipment</tspan><tspan x="1368" dy="29">and e-waste</tspan></text>
    </g>

    <!-- Benefits and costs -->
    <g filter="url(#shadow)">
      <rect x="70" y="710" width="860" height="150" rx="24" fill="#dff0e6"/>
      <rect x="990" y="710" width="860" height="150" rx="24" fill="#f2e5d9"/>
    </g>
    <text x="116" y="758" fill="#205f4c" font-size="29" font-weight="900">CAN HELP</text>
    <text x="116" y="801" fill="#183f48" font-size="25" font-weight="650">climate models · ecosystem monitoring · grid planning</text>
    <text x="116" y="833" fill="#183f48" font-size="25" font-weight="650">hazard warnings · accessibility</text>
    <text x="1036" y="758" fill="#8b5528" font-size="29" font-weight="900">CAN COST</text>
    <text x="1036" y="801" fill="#42382f" font-size="25" font-weight="650">land · electricity · cooling resources</text>
    <text x="1036" y="833" fill="#42382f" font-size="25" font-weight="650">infrastructure · hardware</text>
    <rect x="536" y="839" width="848" height="44" rx="22" fill="#e5a544"/>
    <text x="960" y="869" fill="#173745" font-size="22" font-weight="850" text-anchor="middle">Benefits and costs may fall on different people and places.</text>

    <!-- Evidence rule -->
    <rect x="70" y="902" width="1780" height="143" rx="24" fill="#0b2432" stroke="#5fa7a8" stroke-width="3"/>
    <text x="110" y="941" fill="#e5a544" font-size="28" font-weight="900">CHECK THE CLAIM</text>
    <text x="110" y="976" fill="#edf6f4" font-size="21" font-weight="650">Define the boundary · name the place, grid, cooling, model, workload and date · use ranges.</text>
    <text x="110" y="1007" fill="#edf6f4" font-size="21" font-weight="650">Ask who benefits, who carries costs, who decides and who checks.</text>
    <text x="110" y="1036" fill="#bcdadb" font-size="20" font-weight="750">Whole data-centre use ≠ the AI share. No single water or energy number applies to every prompt.</text>
  </g>
</svg>
